<!DOCTYPE html>
<html lang="en">
	<head>
		<!-- Basic -->
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<!-- Title (SEO Optimized: ~55 chars) -->
		<title>
			Affordable Car Rental Services | Book Cars Online Near You
		</title>

		<!-- Primary Meta Description (150–160 chars) -->
		<meta
			name="description"
			content="Book affordable car rentals with easy online booking, verified cars, secure payments, and flexible rental plans. Rent cars near you today."
		/>

		<!-- Keywords (Low priority but acceptable) -->
		<meta
			name="keywords"
			content="car rental, rent a car, online car booking, self drive car rental, car hire service, affordable car rental, car rental near me"
		/>

		<!-- Author & Robots -->
		<meta name="author" content="Car Rental Platform" />
		<meta name="robots" content="index, follow" />

		<!-- Canonical -->
		<link rel="canonical" href="https://www.yourwebsite.com/" />

		<!-- Favicon -->
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />

		<!-- Theme Color (Mobile Browsers) -->
		<meta name="theme-color" content="#0f172a" />

		<!-- Open Graph (Facebook / WhatsApp / LinkedIn) -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Car Rental" />
		<meta
			property="og:title"
			content="Affordable Car Rental Services | Book Cars Online"
		/>
		<meta
			property="og:description"
			content="Rent verified cars with easy booking, secure payments, and flexible rental plans. Find affordable car rentals near you."
		/>
		<meta property="og:url" content="https://www.yourwebsite.com/" />
		<meta
			property="og:image"
			content="https://www.yourwebsite.com/og-image.jpg"
		/>

		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta
			name="twitter:title"
			content="Affordable Car Rental Services | Rent Cars Online"
		/>
		<meta
			name="twitter:description"
			content="Book affordable car rentals with verified cars, secure payments, and flexible booking options."
		/>
		<meta
			name="twitter:image"
			content="https://www.yourwebsite.com/og-image.jpg"
		/>

		<!-- Fonts (Optimized: preconnect) -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Fira+Code&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100..900;1,100..900&display=swap"
			rel="stylesheet"
		/>
	</head>

	<body>
		<div id="root"></div>

		<!-- Main App -->
		<script type="module" src="/src/main.jsx"></script>

		<!-- Razorpay -->
		<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
	</body>
</html>
